# Render Blueprint: deploys the API (voice pipeline, REST, media WebSockets) as a hosted demo.
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for GEMINI_API_KEY.
# Free plan sleeps after 15 min idle; data is in memory and the demo dealership is re-seeded on each start.
services:
  - type: web
    name: axo-voice-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: memory
      - key: QUEUE_BACKEND
        value: memory
      - key: AUTH_MODE
        value: dev
      - key: DEV_ORG_ID
        value: demo-org
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.8-flash,gemini-flash-latest
      - key: TELEPHONY_PROVIDER
        value: mock
      - key: STT_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: MESSAGING_PROVIDER
        value: log
      # Dashboard origin(s) for CORS; set to your Vercel URL
      - key: WEB_ORIGIN
        value: https://ai-sales-agent-gold.vercel.app,https://ai-sales-agent-nyay-saathis-projects.vercel.app
